[project]
name = "sherin-tts-engine"
version = "0.1.0"
description = "Offline-first speech synthesis engine for Sherin Cognitor"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
sherin-tts = "sherin_tts.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
