<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sherin TTS Demo</title><style>body{font-family:system-ui;max-width:760px;margin:40px auto;padding:20px;background:#111;color:#eee}textarea{width:100%;height:180px;box-sizing:border-box}button,input,select{padding:10px;margin:6px 0}button{cursor:pointer}</style></head><body><h1>Sherin TTS</h1><p>Local browser prototype. No API key is required.</p><textarea id="text">Hello from Sherin.</textarea><br><label>Rate <input id="rate" type="range" min="0.5" max="2" step="0.05" value="1"></label><br><label>Pitch <input id="pitch" type="range" min="0" max="2" step="0.05" value="1"></label><br><button id="speak">Speak</button><button id="stop">Stop</button><script>const text=document.querySelector('#text');const rate=document.querySelector('#rate');const pitch=document.querySelector('#pitch');document.querySelector('#speak').onclick=()=>{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text.value);u.rate=+rate.value;u.pitch=+pitch.value;speechSynthesis.speak(u)};document.querySelector('#stop').onclick=()=>speechSynthesis.cancel();</script></body></html>
